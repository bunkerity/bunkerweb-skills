# See https://pre-commit.com for more information
# See https://pre-commit.com/hooks.html for more hooks
repos:
  - repo: https://github.com/pre-commit/pre-commit-hooks
    rev: 3e8a8703264a2f4a69428a0aa4dcb512790b2c8c # frozen: v6.0.0
    hooks:
      - id: trailing-whitespace
      - id: end-of-file-fixer
      - id: check-yaml
        args: ["--allow-multiple-documents"]
        # Compose merge tags (!reset, !override) are not plain YAML.
        exclude: ^skills/.*/assets/docker-compose.*\.ya?ml$
      - id: check-json
      - id: check-case-conflict

  - repo: https://github.com/psf/black
    rev: 87928e6d6761a4a6d22250e1fee5601b3998086e # frozen: 26.5.1
    hooks:
      - id: black
        name: Black Python Formatter
        language_version: python3.10
        args: ["--line-length=160"]

  - repo: https://github.com/pycqa/flake8
    rev: d93590f5be797aabb60e3b09f2f52dddb02f349f # frozen: 7.3.0
    hooks:
      - id: flake8
        name: Flake8 Python Linter
        args: ["--max-line-length=160", "--ignore=E266,E402,E501,E722,W503"]

  - repo: local
    hooks:
      - id: prettier
        name: Prettier
        entry: prettier --write
        language: system
        types: [text]
        files: \.(json|markdown|md|yaml|yml)$

      - id: validate-skills
        name: Validate skills
        entry: python3 scripts/validate.py
        language: system
        pass_filenames: false
        files: ^(skills/|\.claude-plugin/|scripts/validate\.py)

  - repo: https://github.com/codespell-project/codespell
    rev: 63c8f8312b7559622c0d82815639671ae42132ac # frozen: v2.4.1
    hooks:
      - id: codespell
        args: [--ignore-words-list, caf]
        name: Codespell Spell Checker
        language: python
        types: [text]

  - repo: https://github.com/gitleaks/gitleaks
    rev: 39fdb480a06768cc41a84ef86959c07ff33091c4 # frozen: v8.28.0
    hooks:
      - id: gitleaks
